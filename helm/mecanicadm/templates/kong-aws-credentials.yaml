# =============================================================================
# KONG AWS CREDENTIALS — credenciais para o Kong invocar a Lambda
# =============================================================================
# O Kong usa o plugin "aws-lambda" para invocar diretamente a Lambda
# (sem API Gateway intermediário). Para isso, precisa de credenciais AWS.
#
# Fluxo:
#   Cliente → POST /lambda/token → Kong Plugin aws-lambda → Lambda (AWS)
#                                                         └── valida CPF, emite JWT
# =============================================================================

{{- if .Values.kongLambda.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mecanicadm.fullname" . }}-kong-aws-credentials
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "mecanicadm.labels" . | nindent 4 }}
type: Opaque
data:
  # Chave de acesso AWS (AWS Access Key ID)
  # Injetada via: --set kongLambda.awsAccessKey="..." no helm upgrade
  aws-access-key: {{ .Values.kongLambda.awsAccessKey | b64enc | quote }}
  # Chave secreta AWS (AWS Secret Access Key)
  aws-secret-access-key: {{ .Values.kongLambda.awsSecretAccessKey | b64enc | quote }}
{{- end }}
