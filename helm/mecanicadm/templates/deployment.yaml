apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mecanicadm.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "mecanicadm.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}

  selector:
    matchLabels:
      {{- include "mecanicadm.selectorLabels" . | nindent 6 }}

  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "mecanicadm.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      serviceAccountName: {{ include "mecanicadm.serviceAccountName" . }}

      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      {{- if .Values.newRelic.enabled }}
      initContainers:
        - name: newrelic-agent
          image: busybox:1.36
          command:
            - sh
            - -c
            - wget -q -O /newrelic/newrelic.jar https://repo1.maven.org/maven2/com/newrelic/agent/java/newrelic-agent/{{ .Values.newRelic.agentVersion }}/newrelic-agent-{{ .Values.newRelic.agentVersion }}.jar
          volumeMounts:
            - name: newrelic-agent
              mountPath: /newrelic
      {{- end }}

      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}

          ports:
            - name: http
              containerPort: 8080
              protocol: TCP

          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}

          envFrom:
            - configMapRef:
                name: {{ include "mecanicadm.configMapName" . }}
            {{- if .Values.externalSecrets.enabled }}
            - secretRef:
                name: {{ include "mecanicadm.fullname" . }}-db-secrets
            {{- end }}
            - secretRef:
                name: {{ include "mecanicadm.secretName" . }}

          {{- if .Values.newRelic.enabled }}
          env:
            - name: JAVA_OPTS
              value: "-javaagent:/newrelic/newrelic.jar"
            - name: NEW_RELIC_LICENSE_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "mecanicadm.secretName" . }}
                  key: NEW_RELIC_LICENSE_KEY
            - name: NEW_RELIC_APP_NAME
              value: {{ .Values.newRelic.appName | quote }}
            - name: NEW_RELIC_LOG_LEVEL
              value: {{ .Values.newRelic.logLevel | quote }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if .Values.newRelic.enabled }}
            - name: newrelic-agent
              mountPath: /newrelic
              readOnly: true
            {{- end }}

          resources:
            {{- toYaml .Values.resources | nindent 12 }}

          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            failureThreshold: 30
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10

          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5

      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      {{- if .Values.newRelic.enabled }}
      volumes:
        - name: newrelic-agent
          emptyDir: {}
      {{- end }}
      - name: tmp
        emptyDir: {}
