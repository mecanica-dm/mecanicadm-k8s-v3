apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "mecanicadm.configMapName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "mecanicadm.labels" . | nindent 4 }}
data:
  SPRING_PROFILES_ACTIVE: {{ .Values.springProfilesActive | quote }}

  MAIL_HOST: {{ .Values.mail.host | quote }}
  MAIL_PORT: {{ .Values.mail.port | quote }}
  MAIL_SMTP_AUTH: {{ .Values.mail.smtpAuth | quote }}
  MAIL_SMTP_STARTTLS: {{ .Values.mail.smtpStarttls | quote }}

  BUDGET_BASE_URL: {{ .Values.budgetBaseUrl | quote }}
