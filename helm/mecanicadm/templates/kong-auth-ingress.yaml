# =============================================================================
# KONG AUTH INGRESS — rota /auth para a Lambda
# =============================================================================

{{- if .Values.kongLambda.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "mecanicadm.fullname" . }}-auth
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "mecanicadm.labels" . | nindent 4 }}
  annotations:
    # Anotação que ativa o plugin aws-lambda neste Ingress
    konghq.com/plugins: {{ include "mecanicadm.fullname" . }}-aws-lambda
spec:
  # Usa o Kong como Ingress Controller
  ingressClassName: kong
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}    # Mesmo domínio do Ingress da API
      http:
        paths:
          - path: /auth            # Prefixo /auth → Lambda
            pathType: Prefix       # Match por prefixo
            backend:
              service:
                name: {{ include "mecanicadm.fullname" $ }}  # Service da API (placeholder)
                port:
                  number: {{ $.Values.service.port }}        # Porta 80
    {{- end }}
{{- end }}
