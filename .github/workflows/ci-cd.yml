name: CI/CD - Terraform EKS + Helm

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  AWS_DEFAULT_REGION: us-east-1

jobs:
  terraform:
    runs-on: ubuntu-latest
    environment: prod

    env:
      TF_VAR_grafana_admin_password: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
      TF_WORKSPACE: prod

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configura credenciais AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup do Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.8.0"

      - name: Ensure S3 backend exists
        run: |
          aws s3api head-bucket --bucket ${{ secrets.TF_STATE_BUCKET }} 2>/dev/null || \
          aws s3api create-bucket --bucket ${{ secrets.TF_STATE_BUCKET }} \
            --region ${{ secrets.AWS_REGION }} \
            --create-bucket-configuration LocationConstraint=${{ secrets.AWS_REGION }}
          aws s3api put-bucket-versioning --bucket ${{ secrets.TF_STATE_BUCKET }} \
            --versioning-configuration Status=Enabled
          aws s3api put-bucket-encryption --bucket ${{ secrets.TF_STATE_BUCKET }} \
            --server-side-encryption-configuration '{
              "Rules": [{
                "ApplyServerSideEncryptionByDefault": {
                  "SSEAlgorithm": "aws:kms"
                },
                "BucketKeyEnabled": true
              }]
            }'

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="region=${{ secrets.AWS_REGION }}" \
            -backend-config="key=terraform/mecanicadm-k8s/terraform.tfstate"

      - name: Terraform Format
        run: terraform fmt -check -diff

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -out=tfplan-prod

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan-prod
